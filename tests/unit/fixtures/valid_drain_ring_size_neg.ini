; UT-NR-25 (M3 C-NR-305/310): a non-positive drain_ring_size is remapped to
; FF_DRAIN_RING_SIZE_DEFAULT instead of reaching the unsigned field as a
; huge value (same trap as reload_heartbeat_timeout_ms, P3-1).
[dpdk]
lcore_mask=7
primary_slim=1
graceful_reload=1
drain_ring_size=-1
port_list=0

[port0]
addr=192.168.1.10
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
lcore_list=1,2
