; UT-NR-02 (M1 graceful_reload): valid graceful_reload=1 + primary_slim=1.
; Modeled after the M0 PoC topology (docs/nginx_reload_spec E-NR-01):
; lcore_mask=7 -> 3 procs; primary lcore 0 excluded from lcore_list.
[dpdk]
lcore_mask=7
primary_slim=1
graceful_reload=1
port_list=0

[port0]
addr=192.168.1.10
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
lcore_list=1,2
