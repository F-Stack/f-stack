; idle_loop_interval is independent of pkt_tx_delay: both are set here with
; different values so a test can prove neither parser branch overwrites the
; other (the pre-fix main_loop() reused pkt_tx_delay for both purposes).
[dpdk]
lcore_mask=1
channel=4
promiscuous=1
numa_on=1
idle_sleep=20
pkt_tx_delay=30
idle_loop_interval=1000
port_list=0

[port0]
addr=192.168.1.10
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
