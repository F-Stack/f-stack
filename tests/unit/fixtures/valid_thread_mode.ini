; CM1 thread_mode=1 fixture: single-process multi-thread multi-stack.
; lcore_mask=0xf -> 4 set bits -> nb_procs(before)=4 -> nb_threads=4.
; ff_check_config thread_mode branch forces proc_type=primary, nb_procs=1,
; and proc_mask=lcore_mask ("0xf"). port0 lcore_list=0-3 must all be within
; proc_lcore[0..3] (validated before the thread_mode collapse).
[dpdk]
lcore_mask=0xf
channel=4
promiscuous=1
numa_on=1
thread_mode=1
port_list=0

[port0]
addr=192.168.1.10
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
lcore_list=0-3

[freebsd.boot]
hz=100
physmem=268435456
fd_reserve=1024
mem_size=256

[freebsd.sysctl]
kern.ipc.maxsockbuf=16777216
